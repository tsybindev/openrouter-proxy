# Fail2ban filter: ловит неудачные попытки авторизации к LLM-прокси.
# Срабатывает на 401/403 с заполненным заголовком Authorization (то есть
# бот реально что-то подставлял в Authorization: Bearer, а не просто
# делал OPTIONS/GET без токена).
#
# Установка на хосте:
#   sudo cp fail2ban/filter.d/nginx-llm-auth.conf /etc/fail2ban/filter.d/
#   sudo cp fail2ban/jail.d/nginx-llm-auth.local /etc/fail2ban/jail.d/
#   sudo systemctl restart fail2ban

[Definition]
failregex = ^<HOST> - [^"]*"[^"]*" (401|403) \d+ "[^"]*" "[^"]*" auth="Bearer [^"]+" .*$
            ^<HOST> - [^"]*"[^"]*" (401|403) \d+ "[^"]*" "[^"]*" auth="sk-[a-zA-Z0-9]+" .*$

# Всё, что не 401/403 с реальным токеном — игнорируем
ignoreregex =

datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S
