server {
    listen 80;
    server_name wp.tsybindev.ru;

    # для получения/обновления сертификата certbot'ом
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wp.tsybindev.ru;

    ssl_certificate     /etc/letsencrypt/live/wp.tsybindev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wp.tsybindev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # Лимит параллельных соединений с одного IP (anti-slowloris)
    limit_conn conn_per_ip 20;

    location / {
        # Rate limit на API: 5 req/s с burst 20.
        # Лишние запросы получают 429.
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # важно для стриминга (SSE) ответов моделей
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
