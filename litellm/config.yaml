model_list:
  # Слева — имя, которое ты указываешь в клиенте (model=...).
  # Справа, в litellm_params.model — реальная модель на OpenRouter
  # (формат openrouter/<vendor>/<model>, полный список в openrouter.ai/models).
  #
  # model_info.input_cost_per_token / output_cost_per_token — задаются за 1 ТОКЕН
  # (не за 1M). Это fallback-цены, используются ТОЛЬКО если OpenRouter не
  # вернул cost в ответе. С use_provider_cost: true в litellm_settings ниже
  # LiteLLM берёт реальный счёт от OpenRouter (который учитывает текущий
  # динамический тариф) — записи model_info нужны только для Admin UI
  # и для случаев, когда провайдер не прислал цену.

  - model_name: glm-5.3-flash
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
      # В карточке модели указан провайдер z-ai, квантование fp8.
      # До 09.09.2026 у Z.ai скидка 50% (0.075/0.25), потом вернётся к 0.15/0.50.
      extra_body:
        provider:
          order: ["z-ai"]
          quantizations: ["fp8"]
          allow_fallbacks: true
    model_info:
      input_cost_per_token: 0.000000075
      output_cost_per_token: 0.00000025

  - model_name: deepseek-v4-flash-vision
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash-vision-exp
      api_key: os.environ/OPENROUTER_API_KEY
      # Провайдер по карточке один — deepseek (только он и хостит)
      extra_body:
        provider:
          order: ["deepseek"]
          allow_fallbacks: true
    model_info:
      input_cost_per_token: 0.00000022
      output_cost_per_token: 0.00000066

  - model_name: nemotron-3-ultra-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      # Бесплатная модель. У OpenRouter провайдер — nvidia
      extra_body:
        provider:
          order: ["nvidia"]
          allow_fallbacks: true
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: poolside-laguna-s2-free
    litellm_params:
      model: openrouter/poolside/laguna-s-2.1:free
      api_key: os.environ/OPENROUTER_API_KEY
      # В карточке провайдер poolside, квантование fp4
      extra_body:
        provider:
          order: ["poolside"]
          quantizations: ["fp4"]
          allow_fallbacks: true
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: minimax-m3-free
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: os.environ/OPENROUTER_API_KEY
      # Free-вариант MiniMax M3, провайдер только GMICloud
      extra_body:
        provider:
          order: ["gmicloud"]
          quantizations: ["fp8"]
          allow_fallbacks: false
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Алиас "free" — список бесплатных моделей с round-robin балансировкой
  # (аналог openrouter/free, но без сюрпризов с их внутренним роутером).
  # Клиент шлёт model=free, LiteLLM случайно выбирает одну из ниже.
  # nemotron-3-ultra-free убран из ротации: провайдер nvidia на бесплатном
  # OpenRouter-ключе часто отдаёт 404 "function not found" — привязка
  # провайдера требует opt-in в OpenRouter. Модель оставлена отдельной записью
  # выше, чтобы её можно было дёрнуть напрямую после активации провайдера.
  - model_name: free
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          order: ["gmicloud"]
          quantizations: ["fp8"]
          allow_fallbacks: false
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: free
    litellm_params:
      model: openrouter/poolside/laguna-s-2.1:free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          order: ["poolside"]
          quantizations: ["fp4"]
          allow_fallbacks: true
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Wildcard-роутер: ловит любой model= который не совпал с явными записями выше,
  # и проксирует его на openrouter/<тот же самый id>. Если такого id нет в
  # OpenRouter — провайдер вернёт 404, LiteLLM отдаст 404 клиенту.
  # Эта запись позволяет не прописывать каждую модель вручную.
  # NB: для wildcard не работают provider-routing и явный прайс — цена берётся
  # из ответа OpenRouter (use_provider_cost: true ниже).
  - model_name: "*"
    litellm_params:
      model: openrouter/*
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          # Без жёсткого order — даём OpenRouter'у самому выбирать по умолчанию
          allow_fallbacks: true

  # Добавляй свои модели по этому же шаблону.
  # Актуальные id моделей смотри тут: https://openrouter.ai/models

litellm_settings:
  drop_params: true          # не падать, если клиент шлёт лишние/несовместимые параметры
  set_verbose: false
  # use_provider_cost: true — для расчёта spend-логов LiteLLM использует
  # реальный usage.cost, который вернул OpenRouter в ответе, а не свою
  # таблицу цен. Это автоматически учитывает динамические тарифы провайдера
  # (например, у Z.ai сейчас скидка 50% до 09.09 — OpenRouter сам это спишет
  # правильно, без правки model_info).
  use_provider_cost: true

# Router: round-robin между всеми моделями с одинаковым model_name (для алиаса "free")
# и fallback-цепочка: если основная модель не ответила (404/5xx/timeout),
# LiteLLM попробует следующую из списка. Это спасает когда у провайдера
# отвалился free-эндпоинт или модель ещё не активирована на ключе.
router_settings:
  num_retries: 2
  timeout: 60
  routing_strategy: simple-shuffle
  fallbacks:
    # LiteLLM требует формат: ключ — имя модели, значение — список fallback-моделей.
    # nemotron-3-ultra-free часто отдаёт 404 "function not found" на провайдере
    # nvidia, если провайдер не активирован на ключе — падать на нём нельзя,
    # прокидываем запрос на poolside/minimax.
    - nemotron-3-ultra-free: ["poolside-laguna-s2-free", "minimax-m3-free"]
    # Алиас "free": если все бесплатные варианты упали, пробуем платную glm как последний шанс.
    - free: ["poolside-laguna-s2-free", "minimax-m3-free", "glm-5.3-flash"]

general_settings:
  # Единый мастер-токен: это и админ-ключ, и пароль входа в Admin UI (/ui).
  # Клиенты, которым нужен именно общий доступ, шлют:
  # Authorization: Bearer <LITELLM_MASTER_KEY>
  master_key: os.environ/LITELLM_MASTER_KEY

  # store_model_in_db: true (задаётся также через ENV STORE_MODEL_IN_DB=True
  # в docker-compose.yml) — включает Admin UI и позволяет добавлять/менять
  # модели через веб-интерфейс, а не только через этот файл.
  store_model_in_db: true
