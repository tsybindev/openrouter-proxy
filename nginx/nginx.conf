user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'auth="$http_authorization" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    server_tokens off;

    # Rate limit: не больше 5 запросов/сек на IP к API, с burst 20.
    # Бот-переборщик ключей получает 429 сразу после первых 5 запросов.
    # Валидные клиенты обычно не превышают 1-2 req/s, так что легитимный
    # трафик не пострадает.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req_status 429;

    # Лимит параллельных соединений с одного IP (защита от slowloris)
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    # Буфер для больших заголовков (OpenAI-совместимые клиенты иногда
    # шлют длинные tool-call блоки)
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    include /etc/nginx/conf.d/*.conf;
}
